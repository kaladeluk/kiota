name: Publish Kaladel.Kiota.NullabilityFix.TypeScript

on:
  push:
    tags:
      - "nullabilityfix-ts-v*.*.*"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

env:
  PROJECT_PATH: Kaladel.Kiota.NullabilityFix.TypeScript/Kaladel.Kiota.NullabilityFix.TypeScript.csproj
  TEST_PROJECT_PATH: Kaladel.Kiota.NullabilityFix.TypeScript.Tests/Kaladel.Kiota.NullabilityFix.TypeScript.Tests.csproj

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore ${{ env.PROJECT_PATH }}

      - name: Build
        run: dotnet build ${{ env.PROJECT_PATH }} --configuration Release --no-restore

      - name: Test
        run: dotnet test ${{ env.TEST_PROJECT_PATH }} --configuration Release

      - name: Pack
        run: dotnet pack ${{ env.PROJECT_PATH }} --configuration Release --no-build --output ./artifacts

      - name: NuGet login (OIDC → temp API key)
        uses: NuGet/login@v1
        id: nuget-login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "./artifacts/*.nupkg"
          --api-key ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Kaladel.Kiota.NullabilityFix.TypeScript ${{ github.ref_name }}"
          files: ./artifacts/*
          generate_release_notes: true
